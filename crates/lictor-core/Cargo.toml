# SPDX-License-Identifier: MIT
[package]
name = "lictor-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "lictor-core: frozen types for the deterministic safety fuse (no_std-capable; no logic beyond constructors, validation and compile)"

[features]
default = ["std"]
std = ["serde/std", "dep:toml", "dep:serde_json", "dep:lictor-canon"]

[dependencies]
serde = { workspace = true }
libm = { workspace = true }
toml = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
lictor-canon = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
